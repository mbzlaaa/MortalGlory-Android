name: Decompile Assembly-CSharp (method bodies)
# ============================================================
#  阶段2-①：云端方法体级反编译
#  目的：在 GitHub Actions runner 上用 ilspycmd 反编译出 *含方法体* 的完整 C#
#  产出：upload artifact，下载后用于把工程里的 NotImplementedException 占位
#        替换成真实逻辑。
#  说明：构建 runner 网络不受用户 vpn 影响；本 workflow 只做反编译，不跑 Unity。
# ============================================================
on:
  workflow_dispatch: {}   # 只在网页或 API 手动触发
jobs:
  decompile:
    name: ILSpy method-body dump
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. 拉代码（需要仓库里有 DLL 源）----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 2. 定位 Assembly-CSharp.dll ----------
      #  优先用仓库里的 Managed 副本；若没有则提示如何放入
      - name: Locate assembly
        id: locate
        run: |
          set -u
          echo "--- 搜索仓库中的 Assembly-CSharp.dll ---"
          FOUND=$(find . -name 'Assembly-CSharp.dll' -not -path '*/Library/*' | head -n1 || true)
          if [ -z "$FOUND" ]; then
            echo "::error::未找到 Assembly-CSharp.dll。请把游戏 Managed 目录中的 Assembly-CSharp.dll 与 Assembly-CSharp-firstpass.dll 提交到 Input/Managed/ 下再触发。"
            exit 1
          fi
          echo "assembly=$FOUND" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"
          ls -la "$(dirname "$FOUND")"

      # ---------- 3. 安装 .NET + ilspycmd ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ilspycmd
        run: |
          dotnet tool install --global ilspycmd
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # ---------- 4. 全量反编译（含方法体）----------
      - name: Decompile with method bodies
        run: |
          set -u
          mkdir -p out/full out/project
          DLL="${{ steps.locate.outputs.assembly }}"
          echo "反编译主程序集: $DLL"
          # 完整反编译（默认输出 C# 含方法体与方法实现）
          ilspycmd "$DLL" -o out/full >/dev/null 2>&1 || ilspycmd "$DLL" -o out/full
          echo "--- out/full 文件数 ---"
          find out/full -name '*.cs' | wc -l
          echo "--- 抽样：Skill 类是否含方法体 ---"
          grep -rl 'class Skill' out/full | head -n1 | xargs -r sed -n '1,40p'

          # 若存在 firstpass 也一并反编译
          FP=$(find . -name 'Assembly-CSharp-firstpass.dll' -not -path '*/Library/*' | head -n1 || true)
          if [ -n "$FP" ]; then
            echo "反编译 firstpass: $FP"
            ilspycmd "$FP" -o out/full_firstpass >/dev/null 2>&1 || ilspycmd "$FP" -o out/full_firstpass
          fi

      # ---------- 5. 打包产物 ----------
      - name: Package output
        run: |
          tar -czf decompiled-csharp.tar.gz out || zip -r decompiled-csharp.zip out
          ls -la decompiled-csharp.*

      - name: Upload decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-csharp
          path: |
            decompiled-csharp.tar.gz
            decompiled-csharp.zip
          if-no-files-found: warn
          retention-days: 14

      # ---------- 6. 同时把完整源码作为第二个 artifact（方便直接看）----------
      - name: Upload raw cs tree
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-cs-tree
          path: out/full/**/*.cs
          if-no-files-found: warn
          retention-days: 14
