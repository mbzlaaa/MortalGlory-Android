name: Build Android APK

# ============================================================
#  Mortal Glory 安卓移植 · 云端编译管线
#  触发方式：push 到 main 分支，或在 Actions 页手动触发
#  使用的 Unity 版本：2019.1.8f1（必须和游戏原版一致）
#  构建镜像：game-ci/unity-builder（开源社区维护）
# ============================================================

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # 允许在 GitHub 网页手动点按钮构建

jobs:
  buildAndroid:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. 拉取代码 ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # ---------- 2. 缓存 Library（加速后续构建）----------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          # 【重要】前缀 Library9- 用于强行打断旧的 Library 缓存（B 路线：清空重建）。
          # 旧缓存里带着已删除脚本的编译记录，会引发 CS2001 后崩溃(exit134)。
          # 只在同前缀内回退，绝不落到旧前缀，避免拿到过期的编译输入。
          key: Library9-Android-${{ hashFiles('UnityProject/Assets/**','UnityProject/ProjectSettings/**','UnityProject/Packages/**') }}
          restore-keys: |
            Library9-Android-

      # ---------- 3. 用 Unity 2019.1.8f1 构建 Android ----------
      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}          # 方案X 需要：个人版授权文件内容
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}              # 你的 Unity 账号邮箱
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}        # 你的 Unity 账号密码
        with:
          projectPath: UnityProject
          unityVersion: 2019.1.8f1
          targetPlatform: Android
          androidExportType: androidPackage     # 直接导出 APK
          buildMethod: ""                       # 留空则用默认构建方法；后续可填自定义 BuildScript.BuildAndroid
          allowDirtyBuild: true

      # ---------- 3.5 构建后自动解剖 APK（B 路线取证）----------
      - name: Dump APK Data layout
        if: always()
        run: python3 Tools/dump_apk.py

      # ---------- 3.6 修复 I2 多语言截断（中文/俄/日/韩等残字）----------
      # 原因：I2 资产 assets/bin/Data/<GUID> 里的非 ASCII 字符串在序列化时
      # 被"按字符数当字节数"截断（如「敏捷度提高10点。」9字符/23字节 → 只剩 9 字节）。
      # 此处用工程源 YAML(I2Languages.asset) 的完整值按真实 UTF-8 字节长度重写，
      # 并保留文件尾部 mLanguages 语言列表，输出 *-patched-unsigned.apk。
      - name: Patch I2 localization
        if: always()
        run: python3 Tools/patch_i2_apk.py 2>&1 | tail -30

      # ---------- 3.7 zipalign + 重签（改了 APK 内容，原签名必然失效）----------
      # 重签必须用与设备已装包相同的密钥（Tools/keys/ks.jks），否则无法覆盖升级。
      # 可用 secret 覆盖仓库内测试密钥：ANDROID_KEYSTORE_BASE64。
      - name: Re-align and sign patched APK
        if: always()
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          shopt -s nullglob
          files=(build/Android/*-patched-unsigned.apk)
          if [ ${#files[@]} -eq 0 ]; then echo "NO_PATCHED_APK"; exit 0; fi
          APK="${files[0]}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ZA=$(ls "$SDK"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          AS=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "zipalign=$ZA"; echo "apksigner=$AS"
          if [ -z "$ZA" ] || [ -z "$AS" ]; then echo "NO_BUILD_TOOLS"; exit 0; fi
          ALIGNED="${APK%-patched-unsigned.apk}-aligned.apk"
          "$ZA" -p -f 4 "$APK" "$ALIGNED"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          else
            cp Tools/keys/ks.jks "$RUNNER_TEMP/ks.jks"
          fi
          OUT="build/Android/MortalGlory-Android.apk"
          "$AS" sign --ks "$RUNNER_TEMP/ks.jks" \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias k \
            --out "$OUT" "$ALIGNED"
          "$AS" verify --print-certs "$OUT" > "$RUNNER_TEMP/certs.txt" 2>&1 || true
          head -6 "$RUNNER_TEMP/certs.txt" || true
          rm -f "$APK" "$ALIGNED"
          ls -la build/Android/

      # ---------- 4. 上传 APK 产物 ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MortalGlory-Android-APK
          path: build/Android/MortalGlory-Android.apk
          if-no-files-found: error
