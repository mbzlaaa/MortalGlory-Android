name: Acquire Unity License (ALF -> ULF)

# ============================================================
#  方案③ · 全自动获取 Unity 个人版授权
#  job1 request_alf : 用 game-ci v2.1.0 action 生成 .alf
#                     (@main 已被官方硬编码废弃, 必须锁 v2.1.0)
#  job2 acquire_ulf : unity-license-activate(Puppeteer) 自动
#                     操作 license.unity3d.com/manual 换回 .ulf,
#                     再用 gh 写入 secret UNITY_LICENSE
# ============================================================

on:
  workflow_dispatch: {}

jobs:
  request_alf:
    name: 1) Request manual activation file (.alf)
    runs-on: ubuntu-latest
    outputs:
      alf: ${{ steps.locate.outputs.path }}
    steps:
      - name: Request manual activation file
        uses: game-ci/unity-request-activation-file@v2.1.0
        with:
          unityVersion: 2019.1.8f1

      - name: Locate .alf file (robust)
        id: locate
        run: |
          F=$(ls *.alf 2>/dev/null | head -n1)
          echo "path=$F" >> "$GITHUB_OUTPUT"
          echo "ALF found at: $F"
          echo "--- workspace ---"
          ls -la

      - name: Upload .alf artifact
        uses: actions/upload-artifact@v4
        with:
          name: alf-file
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  acquire_ulf:
    name: 2) Acquire .ulf & update secret
    needs: [request_alf]
    runs-on: ubuntu-latest
    steps:
      - name: Download .alf artifact
        uses: actions/download-artifact@v4
        with:
          name: alf-file

      - name: Show workspace
        run: ls -la

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install unity-license-activate & unity-verify-code
        run: |
          npm install --global unity-license-activate
          npm install --global unity-verify-code

      - name: Activate the license (ALF -> ULF)
        id: activate
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP_KEY: ${{ secrets.UNITY_TOTP_KEY }}
        run: |
          ALF_FILE=$(ls *.alf 2>/dev/null | head -n1)
          echo "ALF_FILE=$ALF_FILE"
          EXTRA=""
          if [ -n "$UNITY_TOTP_KEY" ]; then
            EXTRA="--authenticator-key $UNITY_TOTP_KEY"
          fi
          echo "Running: unity-license-activate <email> <password> $ALF_FILE $EXTRA"
          unity-license-activate "$UNITY_EMAIL" "$UNITY_PASSWORD" "$ALF_FILE" $EXTRA

      - name: Locate .ulf file
        id: ulf
        run: |
          F=$(ls *.ulf 2>/dev/null | head -n1)
          echo "path=$F" >> "$GITHUB_OUTPUT"
          echo "ULF found at: $F"

      - name: Upload .ulf artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulf-file
          path: ./*.ulf
          if-no-files-found: warn

      - name: Update secret UNITY_LICENSE
        if: ${{ steps.ulf.outputs.path != '' }}
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh secret set UNITY_LICENSE --repo "${{ github.repository }}" < "${{ steps.ulf.outputs.path }}"
          echo "Secret UNITY_LICENSE updated."

      - name: Result summary
        if: always()
        run: |
          echo "=== acquire-license result ==="
          echo "activate outcome : ${{ steps.activate.outcome }}"
          echo "ulf path         : ${{ steps.ulf.outputs.path }}"

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error.png
          if-no-files-found: warn
